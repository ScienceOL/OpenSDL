// Minimal wire surface of etcd v3.6.5 KV, etcd-io/etcd at
// a0614505aff9b8ff469e9c59c2d979a5936d13f4, api/{etcdserverpb/rpc,mvccpb/kv}.proto.
// Only fields used by the directory are declared.
syntax = "proto3";
package etcdserverpb;

service KV {
  rpc Range(RangeRequest) returns (RangeResponse);
  rpc Txn(TxnRequest) returns (TxnResponse);
}
message RangeRequest {
  bytes key = 1;
  bytes range_end = 2;
  int64 limit = 3;
}
message KeyValue {
  bytes key = 1;
  int64 mod_revision = 3;
  bytes value = 5;
}
message RangeResponse {
  repeated KeyValue kvs = 2;
  bool more = 3;
}
message PutRequest {
  bytes key = 1;
  bytes value = 2;
}
message DeleteRangeRequest { bytes key = 1; }
message Compare {
  enum Target {
    VERSION = 0;
    MOD = 2;
    VALUE = 3;
  }
  Target target = 2;
  bytes key = 3;
  oneof operand {
    int64 version = 4;
    int64 mod_revision = 6;
    bytes value = 7;
  }
}
message RequestOp {
  oneof request {
    PutRequest put = 2;
    DeleteRangeRequest delete_range = 3;
  }
}
message TxnRequest {
  repeated Compare compare = 1;
  repeated RequestOp success = 2;
}
message TxnResponse { bool succeeded = 2; }
