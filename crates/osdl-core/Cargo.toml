[package]
name = "osdl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for OpenSDL — platform-agnostic lab hardware control via MQTT"

[features]
default = []
serial = ["dep:tokio-serial"]
espnow = ["dep:tokio-serial", "dep:osdl-firmware-protocol"]

[dependencies]
osdl-firmware-protocol = { path = "../osdl-firmware-protocol", optional = true }
uuid.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml.workspace = true
tokio.workspace = true
rumqttc.workspace = true
rumqttd.workspace = true
rusqlite.workspace = true
async-trait.workspace = true
mdns-sd.workspace = true
log.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio-serial = { workspace = true, optional = true }
shellexpand.workspace = true
reqwest.workspace = true
sha1.workspace = true
base64.workspace = true
quick-xml.workspace = true
cbc = { version = "0.1", features = ["alloc"] }
des = "0.8"
encoding_rs = "0.8"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
env_logger.workspace = true
