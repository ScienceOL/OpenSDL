[package]
name = "osdl-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "gRPC server library wrapping the OpenSDL engine"

[dependencies]
x509-parser = { version = "0.18", features = ["verify"] }
osdl-auth = { path = "../osdl-auth" }
sha2.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
time = "0.3"
base64.workspace = true
ring = "0.17"
tempfile.workspace = true
osdl-core = { path = "../osdl-core" }
opensdl-assets = { path = "../opensdl-assets" }
rusqlite.workspace = true
serde_yaml.workspace = true
uuid.workspace = true
anyhow.workspace = true
osdl-proto = { path = "../osdl-proto" }
tokio = { workspace = true }
tokio-stream = { workspace = true }
async-stream = "0.3"
async-trait = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
directories = { workspace = true }
url = "2"
hyper-util = { workspace = true }
tower = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Native Win32 process check for `lockfile::pid_alive` — without this
# Windows treats every stale lockfile as live and refuses to start.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_Storage_FileSystem"] }

[features]
default = []
espnow = ["osdl-core/espnow"]

[dev-dependencies]
h2 = "0.4"
bytes = "1"
http.workspace = true
