{
  "apiVersion": "assets.opensdl.org/v1alpha1",
  "kind": "VirtualAsset",
  "metadata": {
    "name": "uv-vis-spectrophotometer",
    "displayName": "UV 10 Spectrophotometer",
    "version": "1.0.0",
    "description": "Original OpenSDL generic optical bench with a real sample bay, hinged opaque cover and removable 10 mm path rectangular cuvette. Explicit synthetic Gaussian absorbance curve and Beer-Lambert attenuation; blank reference is wavelength-specific. No measured optical accuracy or chemical identification.",
    "tags": [
      "original",
      "sensor"
    ],
    "license": {
      "spdx": "CC-BY-NC-4.0",
      "file": "LICENSE"
    }
  },
  "spec": {
    "type": "instrument",
    "source": {
      "format": "openusd",
      "root": "source/model.usda"
    },
    "preview": {
      "model": "preview.glb",
      "thumbnail": "thumbnail.png"
    },
    "capabilities": [
      "visual",
      "simulation",
      "opensdl-device"
    ],
    "bindings": {
      "deviceTypes": [
        "simulation.uv_vis_spectrophotometer"
      ]
    },
    "compatibility": {
      "runtimes": [
        {
          "name": "opensdl",
          "versions": [
            ">=0.4.0"
          ],
          "status": "expected"
        }
      ]
    },
    "runtime": {
      "engine": "kinematic",
      "config": "source/world.yaml"
    }
  }
}
