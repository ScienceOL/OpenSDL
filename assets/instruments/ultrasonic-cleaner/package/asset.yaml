{
  "apiVersion": "assets.opensdl.org/v1alpha1",
  "kind": "VirtualAsset",
  "metadata": {
    "name": "ultrasonic-cleaner",
    "displayName": "UC 3.3 Ultrasonic Cleaner",
    "version": "1.0.0",
    "description": "Original OpenSDL generic design. Timed bath with 300 W heater and 30 W declared acoustic thermal input. No cavitation, cleaning efficacy, evaporation or temperature-uniformity prediction.",
    "tags": [
      "original",
      "heater"
    ],
    "license": {
      "spdx": "CC-BY-NC-4.0",
      "file": "LICENSE"
    }
  },
  "spec": {
    "type": "instrument",
    "source": {
      "format": "openusd",
      "root": "source/model.usda"
    },
    "preview": {
      "model": "preview.glb",
      "thumbnail": "thumbnail.png"
    },
    "capabilities": [
      "visual",
      "simulation",
      "opensdl-device"
    ],
    "bindings": {
      "deviceTypes": [
        "simulation.ultrasonic_cleaner"
      ]
    },
    "compatibility": {
      "runtimes": [
        {
          "name": "opensdl",
          "versions": [
            ">=0.5.0"
          ],
          "status": "expected"
        }
      ]
