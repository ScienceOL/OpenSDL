{
  "apiVersion": "assets.opensdl.org/v1alpha1",
  "kind": "VirtualAsset",
  "metadata": {
    "name": "ph-meter",
    "displayName": "PH 14 Bench Meter",
    "version": "1.0.0",
    "description": "Original OpenSDL generic design; Original electrode arm and synthetic pH 4/7/10 fixtures. First-order 2 s response and a neutral-buffer teaching calibration. No electrochemical accuracy, temperature compensation or real electrode ageing model.",
    "tags": [
      "original",
      "probe"
    ],
    "license": {
      "spdx": "CC-BY-NC-4.0",
      "file": "LICENSE"
    }
  },
  "spec": {
    "type": "instrument",
    "source": {
      "format": "openusd",
      "root": "source/model.usda"
    },
    "preview": {
      "model": "preview.glb",
      "thumbnail": "thumbnail.png"
    },
    "capabilities": [
      "visual",
      "simulation",
      "opensdl-device"
    ],
    "bindings": {
      "deviceTypes": [
        "simulation.ph_meter"
      ]
    },
    "compatibility": {
      "runtimes": [
        {
          "name": "opensdl",
          "versions": [
            ">=0.4.0"
          ],
          "status": "expected"
        }
      ]
    },
    "runtime": {
      "engine": "kinematic",
      "config": "source/world.yaml"
    }
  }
}
