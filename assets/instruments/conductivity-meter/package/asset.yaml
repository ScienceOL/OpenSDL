{
  "apiVersion": "assets.opensdl.org/v1alpha1",
  "kind": "VirtualAsset",
  "metadata": {
    "name": "conductivity-meter",
    "displayName": "EC 2 Conductivity Meter",
    "version": "1.0.0",
    "description": "Original OpenSDL generic meter, lift carriage, two separate cell electrodes and removable 100 mL synthetic vessel. First-order cell response, declared linear 25 C temperature compensation and one-point synthetic standard calibration. No measured cell constant or real sample identification.",
    "tags": [
      "original",
      "sensor"
    ],
    "license": {
      "spdx": "CC-BY-NC-4.0",
      "file": "LICENSE"
    }
  },
  "spec": {
    "type": "instrument",
    "source": {
      "format": "openusd",
      "root": "source/model.usda"
    },
    "preview": {
      "model": "preview.glb",
      "thumbnail": "thumbnail.png"
    },
    "capabilities": [
      "visual",
      "simulation",
      "opensdl-device"
    ],
    "bindings": {
      "deviceTypes": [
        "simulation.conductivity_meter"
      ]
    },
    "compatibility": {
      "runtimes": [
        {
          "name": "opensdl",
          "versions": [
            ">=0.5.0"
          ],
          "status": "expected"
        }
      ]
    },
    "runtime": {
      "engine": "kinematic",
      "config": "source/world.yaml"
    }
  }
}
