{
  "apiVersion": "assets.opensdl.org/v1alpha1",
  "kind": "VirtualAsset",
  "metadata": {
    "name": "tube-roller",
    "displayName": "TR 60 Tube Roller",
    "version": "1.0.0",
    "description": "Original OpenSDL generic design. Five parallel rollers, 60 rpm maximum and 30 rpm/s slew. The tube rotates opposite the rollers with a 12:16 radius ratio. Motion is prescribed no-slip kinematics; contact, wobble and mixing efficiency are not solved.",
    "tags": [
      "original",
      "stirrer"
    ],
    "license": {
      "spdx": "CC-BY-NC-4.0",
      "file": "LICENSE"
    }
  },
  "spec": {
    "type": "instrument",
    "source": {
      "format": "openusd",
      "root": "source/model.usda"
    },
    "preview": {
      "model": "preview.glb",
      "thumbnail": "thumbnail.png"
    },
    "capabilities": [
      "visual",
      "simulation",
      "opensdl-device"
    ],
    "bindings": {
      "deviceTypes": [
        "simulation.tube_roller"
      ]
    },
    "compatibility": {
      "runtimes": [
        {
          "name": "opensdl",
          "versions": [
            ">=0.5.0"
          ],
          "status": "expected"
        }
      ]
    },
    "runtime": {
      "engine": "kinematic",
      "config": "source/world.yaml"
    }
  }
}
