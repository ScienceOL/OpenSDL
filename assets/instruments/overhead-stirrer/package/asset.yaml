{
  "apiVersion": "assets.opensdl.org/v1alpha1",
  "kind": "VirtualAsset",
  "metadata": {
    "name": "overhead-stirrer",
    "displayName": "OH 1000 Overhead Stirrer",
    "version": "1.0.0",
    "description": "Original OpenSDL generic design. 100 mm carriage travel, explicit stand clamp, immersed paddle and 1000 rpm maximum. No fluid torque, viscosity, shear rate, sloshing or reaction is predicted.",
    "tags": [
      "original",
      "stirrer"
    ],
    "license": {
      "spdx": "CC-BY-NC-4.0",
      "file": "LICENSE"
    }
  },
  "spec": {
    "type": "instrument",
    "source": {
      "format": "openusd",
      "root": "source/model.usda"
    },
    "preview": {
      "model": "preview.glb",
      "thumbnail": "thumbnail.png"
    },
    "capabilities": [
      "visual",
      "simulation",
      "opensdl-device"
    ],
    "bindings": {
      "deviceTypes": [
        "simulation.overhead_stirrer"
      ]
    },
    "compatibility": {
      "runtimes": [
        {
          "name": "opensdl",
          "versions": [
            ">=0.5.0"
          ],
          "status": "expected"
