{
  "apiVersion": "assets.opensdl.org/v1alpha1",
  "kind": "VirtualAsset",
  "metadata": {
    "name": "orbital-shaker",
    "displayName": "OS 250 Orbital Shaker",
    "version": "1.0.0",
    "description": "Original OpenSDL generic design. 250 mm level platform, 25 mm orbit diameter, synthetic flask fixture and explicit clamp interlock. Prescribed motion only; no validated mixing, fluid sloshing, contact forces or manufacturer accuracy.",
    "tags": [
      "original",
      "stirrer"
    ],
    "license": {
      "spdx": "CC-BY-NC-4.0",
      "file": "LICENSE"
    }
  },
  "spec": {
    "type": "instrument",
    "source": {
      "format": "openusd",
      "root": "source/model.usda"
    },
    "preview": {
      "model": "preview.glb",
      "thumbnail": "thumbnail.png"
    },
    "capabilities": [
      "visual",
      "simulation",
      "opensdl-device"
    ],
    "bindings": {
      "deviceTypes": [
        "simulation.orbital_shaker"
      ]
    },
    "compatibility": {
      "runtimes": [
        {
          "name": "opensdl",
          "versions": [
            ">=0.5.0"
          ],
          "status": "expected"
        }
      ]
    },
    "runtime": {
      "engine": "kinematic",
      "config": "source/world.yaml"
    }
  }
}
