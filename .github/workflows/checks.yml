name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/native-checks.yml

  model-provenance:
    name: Sign verified model source bundle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Package exact source inputs and exported model bytes
        run: python tools/instrument-models/attestation_bundle.py --output instrument-source-bundle.tar
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: instrument-source-bundle.tar
          create-storage-record: false
      - uses: actions/upload-artifact@v4
        with:
          name: instrument-source-bundle
          path: instrument-source-bundle.tar
          if-no-files-found: error
