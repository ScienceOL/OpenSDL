# ONVIF camera as a media source.
#
# The engine spawns mediamtx and exposes the camera's RTSP feeds as
# RTSP/HLS/WebRTC under the local gateway. Optionally republishes to a
# remote SRS for off-site viewing.
#
# Credentials must NOT live in this file in production. Use environment
# variables and a templating step at deploy time, or keep this YAML in a
# secrets-managed location.

mqtt: ~
adapters: []

media_gateway:
  advertise_host: 127.0.0.1

media_sources:
  - kind: onvif_camera
    id: cam1
    description: ONVIF dev camera
    rtsp_main: rtsp://USER:PASS@192.168.1.131:554/ch01.264
    rtsp_sub: rtsp://USER:PASS@192.168.1.131:554/ch01_sub.264
    h264_transcode: true
    rtsp_transport_tcp: true
    # Optional control plane. When present, the engine registers `cam1`
    # as a Device under the `onvif` adapter so you can:
    #   lab send cam1 ptz_move -p direction=up
    #   lab send cam1 ptz_stop
    #   lab send cam1 snapshot
    # Snapshots land under <data_dir>/snapshots/cam1/<ts>.jpg; the path
    # surfaces as `snapshot_path` on the next device_status event.
    control:
      onvif_url: http://192.168.1.131:80/onvif/device_service
      username: USER
      password: PASS
      # profile_token: Profile_1   # optional; auto-discovered otherwise
    # Optional remote ingest. Pick one of the two blocks below.
    #
    # --- Local dev SRS (docker-compose.srs.yaml) ---
    # remote_rtmp:
    #   base_url: rtmp://localhost:1935/live   # local dev SRS
    #   stream: cam1                          # defaults to camera id
    #   http_host: localhost:18085            # HLS / FLV egress (http_server port)
    #   webrtc_host: localhost:1985           # WHEP signalling (http_api port)
    #
    # --- Configurable remote SRS example ---
    # `base_url` is the RTMP ingest endpoint. `http_host` and `webrtc_host`
    # are browser-reachable playback and signalling endpoints; they may be
    # the same host when one TLS proxy serves both routes. Replace the
    # reserved example domains with endpoints from your deployment.
    #
    # Note the `https://` prefix on http_host / webrtc_host below.
    # When the host is bare (e.g. `localhost:18085`) the engine emits
    # `http://...` URLs; prefix with `https://` (or `http://` to be
    # explicit) when SRS is fronted by HTTPS ingress. Browser frontends
    # served over HTTPS will refuse to fetch `http://` endpoints, so
    # TLS deployments must use the prefixed form.
    # remote_rtmp:
    #   base_url: rtmp://ingest.media.example:1935/live
    #   stream: lab-1
    #   http_host: https://playback.media.example
    #   webrtc_host: https://playback.media.example
